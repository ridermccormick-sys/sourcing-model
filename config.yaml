# ---------------------------------------------------------------------------
# Investment thesis. Edit this to match your firm. The free-text description
# becomes a similarity feature; keywords drive features and hard-filter flags.
# ---------------------------------------------------------------------------
thesis:
  description: >
    Founder-led, bootstrapped or lightly funded B2B software companies
    raising their first institutional capital. Niche, mission critical SaaS
    sold to businesses (often a vertical or a specific function such as
    finance, compliance, HR, or operations), with high recurring revenue,
    strong retention, and capital efficient growth. The company has proven
    product-market fit, is profitable or near breakeven, and is ready to
    scale sales, marketing, and pricing with an operating partner.
  include_keywords: [b2b, saas, software, subscription, recurring, platform,
                     workflow, compliance, vertical, system of record,
                     bootstrapped, founder-led, profitable, customers,
                     integrations, enterprise, mid-market]
  exclude_keywords: [crypto, blockchain, nft, casino, gambling, cannabis,
                     dating app, consumer app, marketplace, hardware,
                     staffing agency, marketing agency, consulting firm,
                     shop now, add to cart, series d, series e]

filters:
  founded_year_min: 2005
  founded_year_max: 2021
  employees_min: 20
  employees_max: 300
  max_series: A          # flag companies with Series B or later (GSP prefers little prior VC)

scrape:
  user_agent: "Mozilla/5.0 (compatible; company-research-bot/0.1)"
  max_pages_per_company: 8
  request_timeout_s: 15
  per_host_delay_s: 1.5
  workers: 8
  cache_dir: data/cache
  fetch_ats_jobs: true    # use public Greenhouse/Lever/Ashby/Workable job-board APIs

model:
  classifier: blend       # gbm | logreg | blend
  n_bags: 40
  unlabeled_ratio: 3.0    # unlabeled sampled per bag = ratio * n_positives
  negative_weight: 2.0    # weight on explicit "passed - off thesis" negatives
  svd_components: 48
  cv_folds: 5
  explain_top_n: 250
  random_state: 7
